<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promting</title>
</head>
<body>
    <h1 id = "printing"></h1>
    <script>
        'use strict';
        let firstNum = parseInt(prompt("Enter the the first number"))
        let secondNum = parseInt(prompt("Enter the second number"))
        let thirdNum = parseInt(prompt("Enter the third number"))

        let sum = firstNum + secondNum + thirdNum
        let product = firstNum * secondNum * thirdNum
        let average = sum / 3
        
        document.querySelector("#printing").innerHTML = 
        "Sum: " + sum + "<br>" +
        "Product: " + product + "<br>" +
        "Average: " + average;
    </script>
</body>
</html>
